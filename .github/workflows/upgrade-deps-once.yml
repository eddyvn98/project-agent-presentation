name: One-time dependency security upgrade

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout original branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Update parent packages and narrow rehype override
        run: |
          npm pkg set \
            'dependencies.katex=0.18.2' \
            'dependencies.mermaid=12.2.0' \
            'dependencies.react-syntax-highlighter=16.1.1' \
            'overrides.rehype-katex.katex=$katex'
          npm install --package-lock-only --ignore-scripts
          npm ci

      - name: Inspect production dependencies
        run: |
          npm ls katex mermaid rehype-katex react-syntax-highlighter refractor prismjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const [path, info] of Object.entries(lock.packages)) {
            if (/(^|\/)node_modules\/katex$/.test(path) && info.version !== '0.18.2') {
              throw new Error('Unexpected KaTeX: ' + path + '@' + info.version);
            }
            if (/(^|\/)node_modules\/prismjs$/.test(path) && info.version !== '1.30.0') {
              throw new Error('Unexpected PrismJS: ' + path + '@' + info.version);
            }
            if (/(^|\/)node_modules\/refractor$/.test(path) && !info.version.startsWith('5.')) {
              throw new Error('Unexpected refractor: ' + path + '@' + info.version);
            }
          }
          NODE
          npm audit --omit=dev

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm run check:lines
          npm test

      - name: Build demo
        run: npm run build:demo

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser regression suite
        run: npm run test:e2e

      - name: Commit verified dependency files and remove one-time workflow
        run: |
          rm .github/workflows/upgrade-deps-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/upgrade-deps-once.yml
          git diff --cached --check
          git commit -m 'fix(deps): update patched math and syntax rendering dependencies'
          git push origin HEAD:gpt/presentation-upgrade
