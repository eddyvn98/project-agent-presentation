name: Mobile CAD BIM integrated QA
on:
  push:
    branches:
      - qa/integrate-headless-mobile-20261103
  pull_request:
    paths:
      - "lib/project-agent/runtime/design-*.ts"
      - "components/features/projects/ProjectAgentDesignHandoff.tsx"
      - "lib/project-agent/design-handoff.ts"
      - "tests/agent/headless-design*.test.ts"
      - "tests/agent/design-editor.test.ts"
      - "tests/agent/design-review.test.ts"
      - "tests/agent/design-repair.test.ts"
      - "tests/agent/design-approval.test.ts"
      - "tests/agent/design-archive.test.ts"
      - "lib/project-agent/design-archive-store.ts"
      - "scripts/qa-design-archive-mongo.mjs"
      - "components/features/projects/ProjectAgentDesignArchiveLibrary.tsx"
      - "lib/project-agent/runtime/actions.ts"
      - "lib/project-agent/runtime/design-edit-action.ts"
      - "app/api/projects/**/design-archives/**"
      - "lib/project-agent/design-approval-store.ts"
      - "components/features/projects/ProjectAgentDesignApproval.tsx"
      - "components/features/projects/ProjectAgentTaskFiles.tsx"
      - "app/api/projects/**/design-approvals/**"
      - "app/api/projects/**/files/**/save/**"
      - "tests/agent/design-fuzz.test.ts"
      - "tests/agent/design-export-fuzz.test.ts"
      - "components/features/projects/ProjectAgentDesignEditor.tsx"
      - "lib/project-agent/design-editor.ts"
      - "tests/agent/mobile-design-handoff.test.ts"
      - "tests/agent-ui-browser/design-editor.spec.mjs"
      - "tests/agent-ui-browser/design-real-journey.spec.mjs"
      - "tests/agent-ui-browser/design-ui-fuzz.spec.mjs"
      - "qa/design-real.tsx"
      - "qa/design-real-entry.tsx"
      - "design-real-qa.html"
      - "design-handoff-qa.html"
      - "qa/design-handoff-entry.tsx"
      - "tests/agent-ui-browser/design-handoff.spec.mjs"
      - "qa/design-real-server.ts"
      - "qa/agent-ui.tsx"
      - "vite.agent-ui.config.ts"
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - name: Validate TypeScript and source line limits
        run: npm run typecheck && npm run check:lines
      - name: Validate CAD IFC and mobile handoff regression suites
        run: npx vitest run --config vitest.agent.config.ts tests/agent/headless-design.test.ts tests/agent/headless-design-edit.test.ts tests/agent/design-editor.test.ts tests/agent/design-review.test.ts tests/agent/design-repair.test.ts tests/agent/design-approval.test.ts tests/agent/design-archive.test.ts tests/agent/design-fuzz.test.ts tests/agent/design-export-fuzz.test.ts tests/agent/mobile-design-handoff.test.ts tests/agent/mobile-capture-review.test.tsx
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Phone and desktop preview, edit and download
        env:
          CAD_QA_ONLY: "1"
        run: npx playwright test --config playwright.agent-ui.config.ts --workers=1 tests/agent-ui-browser/design-handoff.spec.mjs tests/agent-ui-browser/design-editor.spec.mjs tests/agent-ui-browser/design-real-journey.spec.mjs tests/agent-ui-browser/design-ui-fuzz.spec.mjs
      - name: Preserve actual user workflow screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-cad-bim-user-journey
          path: test-results/agent-ui/
          if-no-files-found: ignore
          retention-days: 7
  archive_mongo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install isolated MongoDB client
        run: npm install --no-save --package-lock=false mongodb@6
      - name: Real Mongo archive, simultaneous saves, integrity and process restart
        env:
          CAD_QA_MONGO_URI: mongodb://127.0.0.1:27017
        run: node scripts/qa-design-archive-mongo.mjs
  bim_roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check "ifcopenshell==0.8.4" "numpy<2.4"
      - name: Export, reopen and validate IFC4 solids and dimensions
        run: node scripts/qa-design-ifc.mjs
