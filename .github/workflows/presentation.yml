name: Presentation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:lines
      - run: npm test
      - run: npm run test:agent
      - run: node --test tests/node/*.test.mjs
      - run: npm run build:demo
      - run: npx playwright install --with-deps chromium
      - name: Isolated P8 Chromium benchmark (40 local fixtures)
        run: npm run test:p8:browser
        env:
          PROJECT_AGENT_BROWSER_AGENT: "1"
          PROJECT_AGENT_P8_REAL_BROWSER_QA: "1"
      - run: npm run test:e2e
