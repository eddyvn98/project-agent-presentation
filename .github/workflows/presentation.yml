name: Presentation checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: presentation-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:lines
      - run: npm run check:agent-routes
      - run: npm test
      - run: npm run test:agent
      - name: L1 L2 deterministic long-session test (100/500/1000 turns)
        run: |
          mkdir -p test-results/long-session
          npm run test:long-session 2>&1 | tee test-results/long-session/l1-l2.log
      - name: Preserve L1 L2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-session-l1-l2
          path: test-results/long-session/
          if-no-files-found: ignore
          retention-days: 14

      - run: node --test tests/node/*.test.mjs
      - run: npm run build:demo

  l3_recovery:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7
        ports:
          - 27019:27017
    env:
      L3_ISOLATED_QA: "1"
      L3_MONGO_URI: mongodb://127.0.0.1:27019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false mongodb@6
      - name: L3 three-process crash, disconnect, Stop and 1000-turn recovery
        run: |
          set -o pipefail
          mkdir -p test-results/l3
          npm run test:l3:recovery | tee test-results/l3/recovery.json
      - name: L3B three isolated HTTP hosts with shared Mongo checkpoint
        env:
          L3B_ISOLATED_QA: "1"
          L3B_MONGO_URI: mongodb://127.0.0.1:27019
        run: |
          set -o pipefail
          npm run test:l3b:hosts | tee test-results/l3/shared-hosts.json
      - name: Preserve L3 recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l3-recovery-report
          path: test-results/l3/
          if-no-files-found: ignore
          retention-days: 14

  l7_memory_race:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7
        ports:
          - 27019:27017
    env:
      L7_ISOLATED_QA: "1"
      L7_MONGO_URI: mongodb://127.0.0.1:27019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false mongodb@6
      - name: L7 50-way compact/Stop race and checkpoint contention
        run: |
          set -o pipefail
          mkdir -p test-results/l7
          npm run test:l7:race | tee test-results/l7/report.json
      - name: Preserve L7 race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l7-memory-race
          path: test-results/l7/
          if-no-files-found: ignore
          retention-days: 14

  l10_virtual_soak:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7
        ports:
          - 27019:27017
    env:
      L10_ISOLATED_QA: "1"
      L10_MONGO_URI: mongodb://127.0.0.1:27019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false mongodb@6
      - name: L10 virtual 48-hour shared Mongo lease/Stop/crash/reconnect test
        run: |
          set -o pipefail
          mkdir -p test-results/l10
          npm run test:l10:soak | tee test-results/l10/virtual-soak.json
      - name: Preserve L10 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l10-virtual-soak
          path: test-results/l10/
          if-no-files-found: ignore
          retention-days: 14

  l11_l12_l13:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:7
        ports:
          - 27019:27017
    env:
      L11_ISOLATED_QA: "1"
      L11_MONGO_URI: mongodb://127.0.0.1:27019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false mongodb@6
      - name: L11 crash consistency and L13 legacy schema safety
        run: |
          set -o pipefail
          mkdir -p test-results/l11-l13
          npm run test:l11l13 | tee test-results/l11-l13/fault-migration.json
      - name: L12 20-user Project/conversation isolation fuzz
        run: |
          set -o pipefail
          npm run test:l12 | tee test-results/l11-l13/multiuser.json
      - name: Preserve L11-L13 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l11-l13-fault-isolation
          path: test-results/l11-l13/
          if-no-files-found: ignore
          retention-days: 14

  l19_l22_scheduler_chaos:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27019:27017
    env:
      L11_ISOLATED_QA: "1"
      L11_MONGO_URI: mongodb://127.0.0.1:27019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false mongodb@6
      - name: L19 scheduled 1000 occurrence CAS race and L22 composite recovery
        run: |
          set -o pipefail
          mkdir -p test-results/l19-l22
          npm run test:l19l22 | tee test-results/l19-l22/report.json
      - name: Preserve L19-L22 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l19-l22-scheduler-chaos
          path: test-results/l19-l22/
          if-no-files-found: ignore
          retention-days: 14

  p2_state_fuzz:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:7
        ports:
          - 27019:27017
    env:
      P2_ISOLATED_QA: "1"
      P2_MONGO_URI: mongodb://127.0.0.1:27019
      P2_FUZZ_SEED: "20261027"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false mongodb@6
      - name: Deterministic 10k-step real Mongo browser ownership fuzz
        run: |
          set -o pipefail
          mkdir -p test-results/p2
          npm run test:p2:fuzz | tee test-results/p2/state-fuzz.json
      - name: Preserve P2 fuzz seed and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-state-fuzz-report
          path: test-results/p2/
          if-no-files-found: ignore
          retention-days: 14

  p2_real_mongo_outage:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      P2_ISOLATED_QA: "1"
      P2_DOCKER_OUTAGE_QA: "1"
      P2_MONGO_URI: mongodb://127.0.0.1:27029
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false mongodb@6
      - name: Stop and restart an exclusively owned MongoDB Docker container
        run: |
          set -o pipefail
          mkdir -p test-results/p2
          npm run test:p2:outage | tee test-results/p2/outage.json
      - name: Preserve outage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-mongo-outage-report
          path: test-results/p2/
          if-no-files-found: ignore
          retention-days: 14

  p1_stress_chaos:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:7
        ports:
          - 27019:27017
    env:
      P1_ISOLATED_QA: "1"
      P1_MONGO_QA: "1"
      P1_MONGO_URI: mongodb://127.0.0.1:27019
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install isolated MongoDB test driver
        run: npm install --no-save --package-lock=false mongodb@6
      - name: Stress - twelve real workers and 120 synthetic tasks
        run: |
          mkdir -p test-results/p1
          npm run test:p1:stress | tee test-results/p1/stress.json
      - name: Chaos - SIGKILL, database disconnect, Stop fencing
        run: npm run test:p1:chaos | tee test-results/p1/chaos.json
      - name: Preserve P1 stress/chaos report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-agent-p1-stress-chaos
          path: test-results/p1/
          if-no-files-found: ignore
          retention-days: 14

  mongo_recovery:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      mongo:
        image: mongo:7
        ports:
          - 27019:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install isolated MongoDB test driver
        run: npm install --no-save --package-lock=false mongodb@6
      - name: Two-process Mongo lease/crash/Stop QA
        run: node scripts/g2-multiworker-browser-qa.mjs
        env:
          G2_ISOLATED_QA: "1"
          G2_MULTIWORKER_MONGO_QA: "1"
          G2_MW_MONGO_URI: mongodb://127.0.0.1:27019

  cross_browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Match WebKit browser to lockfile
        run: npx playwright install webkit
      - name: WebKit Agent component smoke QA
        run: npm run test:agent-ui:cross -- --project=webkit
      - name: Preserve cross-browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-ui-cross-browser-failures
          path: test-results/cross-browser/
          if-no-files-found: ignore
          retention-days: 5

  firefox:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Firefox in native runner (no Docker user namespace restrictions)
        timeout-minutes: 5
        run: npx playwright install firefox
      - name: Firefox Agent component smoke QA
        run: npm run test:agent-ui:cross -- --project=firefox
      - name: Preserve Firefox failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-ui-firefox-failures
          path: test-results/cross-browser/
          if-no-files-found: ignore
          retention-days: 5

  browser:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install isolated Chromium
        timeout-minutes: 5
        run: npx playwright install chromium
      - name: P8 browser benchmark (40 synthetic pages)
        run: npm run test:p8:browser
        env:
          PROJECT_AGENT_BROWSER_AGENT: "1"
          PROJECT_AGENT_P8_REAL_BROWSER_QA: "1"
      - name: P0 isolated Chromium Watch, handoff and Stop E2E
        run: npx vitest run --config vitest.agent.config.ts tests/agent/p0-browser-watch-real.test.ts tests/agent/p0-g1-browser-goal-real.test.ts
        env:
          PROJECT_AGENT_P8_REAL_BROWSER_QA: "1"
      - run: npm run test:e2e
      - name: Preserve L5B browser performance metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l5b-ui-performance
          path: test-results/l5b/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve L15-L16 performance and browser lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l15-l16-regression
          path: test-results/l15-l16/
          if-no-files-found: ignore
          retention-days: 14
      - name: Install isolated accessibility audit
        run: npm install --no-save --package-lock=false @axe-core/playwright@4
      - name: Real-component Agent UX QA (desktop/mobile, light/dark, accessibility)
        run: npm run test:agent-ui:e2e
      - name: Preserve Agent UI QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-ui-qa-screenshots
          path: test-results/agent-ui/
          if-no-files-found: ignore
          retention-days: 5
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-browser-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 5
